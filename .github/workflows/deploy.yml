name: Deploy to GitHub Pages

# main への push でビルドして公開する。
#
# configure-pages に enablement: true を渡しているので、Pages がまだ有効に
# なっていなければワークフローが自分で有効化する。設定画面を触る必要はない。
#
# ただし GitHub Pages を private リポジトリで使うには有料プラン（Pro 以上）が
# 必要。無料プランの場合はリポジトリを public にすれば動く。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを避ける。進行中のものは走り切らせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Pages が未設定なら、このワークフローが有効化する
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
