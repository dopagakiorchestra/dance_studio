<!doctype html>
<html lang="ja">
  <head>

    <meta

      content="BPM と小節数を決めるだけで振り付けを自動で組み立てて、マネキンが踊る動画を書き出せます。映像変換サービスに渡す素材向けに、無音・単色背景で出力します。"

    <!--
      SNS に貼ったときのリンクカード。

    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dance Studio" />
    <meta property="og:title" content="Dance Studio — マネキンが踊る素材動画" />

      property="og:description"
      content="振り付けを考えなくても、8カウント単位の振りが組み上がる。マネキンが踊る無音動画を書き出して、映像変換の素材にできます。"
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dance Studio — マネキンが踊る素材動画" />

    />
